#CI项目
name: QCA-ALL

#CI计划
on:
  #代码变更时自动编译（只关心配置与构建脚本）
  push:
    branches: [main]
    paths:
      - 'Config/**'
      - 'Scripts/**'
      - '.github/scripts/**'
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean
      BRANCHES:
        description: '要构建的分支：main,owrt；留空=both'
        required: false
        default: 'both'
        type: string

#CI权限
permissions: write-all


#CI任务
jobs:
  config-main:
    if: ${{ (github.event.inputs.BRANCHES || '') == '' || (github.event.inputs.BRANCHES || '') == 'both' || (github.event.inputs.BRANCHES || '') == 'all' || contains(format(',{0},', (github.event.inputs.BRANCHES || '')), ',main,') }}
    name: IPQ807X-WIFI-YES-main
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: IPQ807X-WIFI-YES
      #默认主题
      WRT_THEME: vantage
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      #源码分支
      WRT_BRANCH: main
      #源码名称
      WRT_SOURCE: VIKINGYFY/immortalwrt
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}

  config-owrt:
    if: ${{ (github.event.inputs.BRANCHES || '') == '' || (github.event.inputs.BRANCHES || '') == 'both' || (github.event.inputs.BRANCHES || '') == 'all' || contains(format(',{0},', (github.event.inputs.BRANCHES || '')), ',owrt,') }}
    name: IPQ807X-WIFI-YES-owrt
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: IPQ807X-WIFI-YES
      #默认主题
      WRT_THEME: vantage
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      #源码分支
      WRT_BRANCH: owrt
      #源码名称
      WRT_SOURCE: VIKINGYFY/immortalwrt
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
